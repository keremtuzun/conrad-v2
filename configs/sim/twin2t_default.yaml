# Twin2T + MCDE (EXPERIMENTAL_CANDIDATE). All numeric constants are ENGINEERING_ESTIMATE / LITERATURE_PRIOR
# model-form choices, not measurements. Loaded with conrad.twins.twin2t.load_config.
twin2t:
  generator: CONFIGURED          # or a GeneratorKind baseline: FULL_MCDE, INDEPENDENT_STOCHASTIC, RANDOM_WALK, ...
  clock_domain: sim
  generator_version: twin2t-mcde-0.1.0
  mcde:
    mechanism_coupling: true
    topology_coupling: true
    stochastic: true
    events_enabled: true
    interventions_enabled: true
    environment_conditioning: true
    loading_conditioning: true
    corrosion_model: POWER_LAW    # or BILINEAR
    max_stress_concentration: 5.0
    support_load_redistribution: 0.5
    crack_coating_length_scale_m: 0.05
    max_crack_length_m: 1.0
    reference_stress_range_pa: 5.0e+7
    reference_cycles_per_s: 0.05
  observation:
    visibility_threshold: 0.3
    default_fidelity: T0          # T0 abstract | T1 feature-level | T2 sensor-level (renderer hook)
    feature_dim: 16
    wall_loss_sigma_m: 2.0e-4
    anomaly_sigma: 0.05
    crack_sigma_m: 1.0e-3
    crack_detection_limit_m: 2.0e-3
    turbidity_noise_gain: 2.0
    biofouling_noise_gain: 1.5
    corruption_noise_gain: 4.0
    contradiction_magnitude: 0.6
  prior_overrides: {}
