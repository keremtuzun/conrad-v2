# M1-ACTION-E004: gate I5 actions inside integrated missions, iteration 3 (python-kernel SURROGATE; SYNTHETIC_ONLY).
# Same harness as M1-ACTION-E002/E003 (conrad.evaluation.decision_experiments.m1_action_integrated) on the repaired
# Model2T (belief-side iteration 4, commit 0a7179b) plus the I5 iteration-3 decision fix (the calibration-gap
# closure no longer expires with the decision-history window). See docs/audits/I5_ACTION_MATRIX.md, "Iteration 3".
# Frozen before the final run.
#
# Seeds: configs/eval/partitions_i5_v3.yaml (digest-pinned, domain i5_mission_v3). The v1 final seeds
# 7600000..7600009 (M1-ACTION-E002) and the v2 final seeds 7900000..7900009 (M1-ACTION-E003) are SPENT.
# Development 7500000..7500009 (shared with v1/v2) were the only I5 seeds inspected while building iteration 3;
# final_test 7700000..7700009 is run once.
#
# Success floor, UIR bound, contact clearance, arms and baselines are UNCHANGED from E002/E003. They are
# ENGINEERING_ESTIMATE values: ch25/ch26 leave the I5 bounds OPEN.
#
# TWO SCORING CHANGES, both declared here BEFORE the final run, both decided on development seeds only:
#
# 1. I5-NOMINAL is NOT APPLICABLE to the "continue" action criterion, because its warrant cannot arise by
#    construction: one averaged reading per view caps Model2T surface coverage at 0.58-0.79 of the critical
#    component, below the 0.8 a component-level condition needs, and 2.5x the mission time adds no new cell
#    (measured on 7500000-7500002). It still runs, and its over-escalations, hard-constraint violations,
#    traceability, UIR and mission outcome are all still scored. I5-NOMINAL-READABLE carries the continue class.
#
# 2. THE LATENCY BUDGET IS RAISED, for the two nominal (continue) scenarios only, from 4 s to 20 s. This is a
#    relaxation and is called one. Reason, measured on development seeds 7500000-7500004: the warranted
#    CONTINUE follows a confirming look at an uncalibrated critical source (the ch16 L6825 design reading kept
#    from E001), and while the lane survey runs DecisionRouting executes NO information action at all
#    (DEFERRED_UNTIL_LANE_SURVEY_COMPLETE). On the three seeds where the component first reads INTACT during
#    the survey (onset 28 s) every request is deferred for 10 to 12 s, and CONTINUE follows within two
#    decision cycles of the first request the runtime carried out. The delay is the runtime's scheduler and
#    the sensing loop, not Model 1. The artifact records the raw latency, the number of decisions after onset
#    and how many of them routing deferred, so the unadjusted numbers stay visible. 20 s is an
#    ENGINEERING_ESTIMATE, not a measurement: the measured development latencies are 0, 0, 14, 12 and 12 s.
#    Every other scenario keeps the 4 s (two decision cycle) budget of E002 and E003, unchanged.
experiment_id: M1-ACTION-E004
hypothesis: >-
  Inside full integrated missions EGDC issues the warranted action class (continue, request evidence, replan,
  return, escalate / operator alert, store-and-forward) within the latency budget, with zero hard-constraint
  violations, no over-escalation in the nominal missions, traceable decisions with UIR 0, and mission outcomes no
  worse than a rule/FSM baseline and the naive act-on-claims baseline on the same seeds.
partition: final_test
partition_domain: i5_mission_v3
seeds: [7700000, 7700001, 7700002, 7700003, 7700004, 7700005, 7700006, 7700007, 7700008, 7700009]
scenarios: [I5-NOMINAL, I5-NOMINAL-READABLE, I5-CRITICAL-FINDING, I5-UNCERTAIN-BELIEF, I5-ROUTE-BLOCKED,
            I5-BATTERY-RESERVE, I5-TIME-RESERVE, I5-COMMS-OUTAGE]
arms: [egdc_structured, rule_fsm, naive_act_on_claims]
baselines: [rule_fsm, naive_act_on_claims]
# seconds from warrant onset to the first expected action; decisions run every 2 s, so 4 s = two cycles.
# The two nominal (continue) scenarios get 20 s: see change 2 in the header.
latency_budget_s: {default: 4.0, I5-NOMINAL: 20.0, I5-NOMINAL-READABLE: 20.0}
success_floor: 0.9
uir_max: 0.0
contact_clearance_m: 0.3
primary_metric: verdicts.per_scenario_correct_rate
direction: higher
workers: 8  # 16+ ran the host out of memory on DEV probes (other workstreams share it)
keep_bundles: false
limitations: [synthetic data only, python L1 kernel (not Unity), SURROGATE evidence for gate I5]
