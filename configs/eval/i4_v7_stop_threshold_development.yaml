# ACTIVE-MCBR-E010-DEV: I4 V7 stop-threshold efficiency screen, DEVELOPMENT only.
#
# V5 and V6 did not improve info_per_kj over V4_protocol_only. This screen tests whether a conservative
# stop rule can reduce wasted low-value view plans while preserving V4's read rate. Validation/final/OOD remain
# closed unless a threshold improves the failed resource-normalized metric on development.
experiment_id: ACTIVE-MCBR-E010-DEV
partition_file: configs/eval/partitions_i4_mcbr_v4.yaml
partition: development
purpose: design
world_family: ACTIVE_INSPECTION_OCCLUDED_V1
scenario: I4-OCCLUDED
seeds: [8002000, 8002001, 8002002, 8002003, 8002004, 8002005, 8002006, 8002007, 8002008, 8002009, 8002010, 8002011, 8002012, 8002013, 8002014, 8002015, 8002016, 8002017, 8002018, 8002019, 8002020, 8002021, 8002022, 8002023, 8002024, 8002025, 8002026, 8002027, 8002028, 8002029, 8002030, 8002031, 8002032, 8002033, 8002034, 8002035, 8002036, 8002037, 8002038, 8002039]
primary_metric: info_per_kj
direction: higher
baseline: A-B0_random
reference_arms: [V4_protocol_only]
out_name: i4_v7_stop_threshold_development.json
question: >-
  Can a predeclared stop threshold reduce energy-normalized waste enough to improve info_per_kj over
  V4_protocol_only while still beating random views?
runtime:
  duration_s: 100.0
  control_period_s: 0.1
  max_plans_per_need: 4
  model2e_enabled: false
arms:
  A-B0_random: {planner: A-B0_random}
  V4_protocol_only:
    planner: PRODUCTION
    view_execution: {enabled: true}
  V7_stop_005:
    planner: V4
    v4:
      ranker: {kind: bayes_eig, cost_mode: ratio, cost_weight: 1.0, stop_min_value: 0.005}
      with_stop: true
    view_execution: {enabled: true}
  V7_stop_010:
    planner: V4
    v4:
      ranker: {kind: bayes_eig, cost_mode: ratio, cost_weight: 1.0, stop_min_value: 0.01}
      with_stop: true
    view_execution: {enabled: true}
  V7_stop_020:
    planner: V4
    v4:
      ranker: {kind: bayes_eig, cost_mode: ratio, cost_weight: 1.0, stop_min_value: 0.02}
      with_stop: true
    view_execution: {enabled: true}
  V7_stop_050:
    planner: V4
    v4:
      ranker: {kind: bayes_eig, cost_mode: ratio, cost_weight: 1.0, stop_min_value: 0.05}
      with_stop: true
    view_execution: {enabled: true}
workers: 12
decision_rule: >-
  Development only. Unit = one world, paired across arms. A threshold may proceed to validation only if its
  info_per_kj paired benefit has CI95 lower bound above 0 versus A-B0_random and its mean info_per_kj exceeds
  V4_protocol_only on development without reducing mean defect_read below V4_protocol_only. Otherwise reject V7.
