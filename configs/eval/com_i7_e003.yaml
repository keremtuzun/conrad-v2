# COM-I7-E003: gate I7 bandwidth sweep, re-run after the 2026-09-20 BAAC scheduler repair (bounded ch19
# Level 0/1 pre-emption + receiver-relative increment value). Python-kernel SURROGATE; SYNTHETIC_ONLY link.
# Every policy runs the same mission (BAAC primary + shadow arms over the identical offer stream and link).
#
# COM-I7-E001 ran on partitions.yaml mission final_test seeds 5300000-5300004. Those seeds are SPENT and the
# repair made their evidence stale, so this run uses the freshly declared, digest-pinned final_test split of
# configs/eval/partitions_i7_v2.yaml (5500000-5500004), declared before any run touched it. The repair itself
# was designed and measured on the mission DEVELOPMENT seeds 5100000 and 5100001 only.
experiment_id: COM-I7-E003
hypothesis: BAAC retains more mission-relevant information at the receiver than raw/FIFO/fixed-priority at every non-zero bandwidth level
primary_metric: mission_information_retained
direction: higher
baselines: [C-B0_send_all, C-B1_fifo, C-B2_fixed_priority, C-B4_value_per_bit]
partition: final_test
partition_domain: i7_mission_v2
seeds: [5500000, 5500001, 5500002, 5500003, 5500004]
scenario: I7-BANDWIDTH
bandwidth_levels: [1.0, 0.5, 0.1, 0.01, 0.001, 0.0]
closed_loop_levels: []
# deadlines in seconds of AVAILABLE link after the offer (ENGINEERING_ESTIMATE, not from the spec)
deadline_linkup_s: {critical: 30.0, routine: 120.0}
queue_trace_every_s: 10
workers: 8
keep_bundles: false
