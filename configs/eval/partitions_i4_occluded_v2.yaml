# Immutable seed partition for the PRE-REGISTERED REPLICATION of gate I4 on the world family
# ACTIVE_INSPECTION_OCCLUDED_V1. SYNTHETIC_ONLY. Created 2026-09-20 BEFORE any flight on these worlds.
#
# Why: formal run 1 (configs/eval/i4_occluded_unity.yaml, final_test 8000200-8000219, 20 worlds) recorded
# gate I4 = FAIL. It beat fixed views (+0.232 [0.081, 0.399]) and random views (+0.206 [0.030, 0.382]) but not
# coverage-only (+0.163 [-0.045, 0.369]), and lost to coverage on information per time and per energy. The
# power warning in docs/audits/I4_WORLD_FAMILY.md section 8.2 was made before run 1, not after it: the
# per-world outcome is close to all-or-nothing, so 20 paired worlds cannot resolve an effect of that size.
# The honest response to an underpowered interval is a pre-registered replication on fresh worlds, not a
# reinterpretation of the same ones. Run 1's seeds are SPENT and are never re-used or re-run.
#
# NOTHING about the family, the planner, the budgets, the metric or the decision rule changes. Only the number
# of worlds and the arm set change, both declared here and in configs/eval/i4_occluded_unity_rep2.yaml before
# the first flight. DO NOT EDIT: conrad.evaluation.partitions pins the digest of this file's canonical content
# (I4_OCCLUDED_V2_PARTITIONS_SHA256) and refuses a changed copy.
version: partitions-i4-occluded-replication-2026-09-20-v1
replicates: configs/eval/partitions_i4_occluded.yaml
