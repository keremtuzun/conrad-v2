  The held-out failure class reproduces without using any v5 row: nominal missions on fresh development seeds
  may exhaust calibration acquisition attempts and escalate before the continue warrant becomes available.
partition: development
partition_domain: i5_mission_v6
seeds: [7740000, 7740001, 7740002, 7740003, 7740004, 7740005, 7740006, 7740007, 7740008, 7740009]
scenarios: [I5-NOMINAL]
arms: [egdc_structured]
latency_budget_s: {default: 4.0, I5-NOMINAL: 20.0, I5-NOMINAL-READABLE: 20.0}
