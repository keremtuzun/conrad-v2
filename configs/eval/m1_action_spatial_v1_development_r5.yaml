# Spatial V1 I5 localization-envelope correction. DEVELOPMENT only; never gate evidence.
# R4 showed that 0.8 m/s manoeuvres can move a valid 1 Hz position fix beyond
# the unchanged EKF 99.9% innovation gate. The 0.4 fraction stays below the
# 0.57 m one-sample gate radius derived from 0.10 m initial pose sigma and the
# 0.10 m synthetic fix sigma. Sensor noise, gate, safety thresholds, truth,
# support, Model2T, warrant, scenarios, arms, durations, attempt bounds, and
# scoring are unchanged.
experiment_id: M1-ACTION-SPATIAL-V1-DEV-R5
hypothesis: >-
  On the five remaining fresh v9 development worlds, the sampling-consistent
  0.4 m/s mission speed envelope prevents valid-fix innovation lockout and is
  no worse than both baselines on task success, safety entries, and decision
  violations while retaining legitimate nominal intact warrants, zero false
  intact, and grounded action correctness.
partition: development
partition_domain: i5_mission_v9
seeds: [8600005, 8600006, 8600007, 8600008, 8600009]
scenarios: [I5-NOMINAL, I5-CRITICAL-FINDING, I5-UNCERTAIN-BELIEF, I5-ROUTE-BLOCKED,
            I5-BATTERY-RESERVE, I5-TIME-RESERVE, I5-COMMS-OUTAGE]
arms: [egdc_structured, rule_fsm, naive_act_on_claims]
latency_budget_s: {default: 4.0, I5-NOMINAL: 20.0}
success_floor: 0.9
uir_max: 0.0
contact_clearance_m: 0.3
workers: 5
keep_bundles: false
spatial_v1:
  sensor_config: configs/sim/spatial_v1_synthetic_sensor_detectability_v2.json
  sensor_file_sha256: c7f68b08a008135d5a86961135c05930170c19f86d772b10094926f207877efe
  world:
    family: inspectable_pipeline
    survey_sigma_m: 0.0
    survey_endpoint_bound_m: null
  runtime:
    duration_s: 120.0
    cruise_speed_fraction: 0.4
    max_plans_per_need: 24
    decision: {max_information_attempts: 24}
    view_execution: {enabled: true, max_view_attempts: 24}
  runtime_by_scenario:
    I5-NOMINAL: {duration_s: 480.0}
  default_truth:
    axial_cells: 2
    sectors: 4
    base: {corrosion_depth_m: 0.0, crack_length_m: 0.0, crack_depth_m: 0.0}
  truth_by_scenario:
    I5-CRITICAL-FINDING: &covered_resolvable_defect
      axial_cells: 2
      sectors: 4
      cell_states:
        - {}
        - {}
        - {corrosion_depth_m: 0.008}
        - {corrosion_depth_m: 0.008}
        - {}
        - {}
        - {corrosion_depth_m: 0.008}
        - {corrosion_depth_m: 0.008}
    I5-COMMS-OUTAGE: *covered_resolvable_defect
  model2t:
    axial_cells: 2
    sectors: 4
    thresholds:
      corrosion_degraded_m: 0.002
      corrosion_severe_m: 0.006
      corrosion_failed_m: 0.012
      crack_degraded_m: 0.003
      crack_severe_m: 0.01
      crack_failed_m: 0.03
    required_looks: 1
    required_domain: {axial_fraction: [0.05, 0.95], sectors: [2, 3]}
limitations: [synthetic data only, python L1 kernel, development evidence only, physical calibration pending]
