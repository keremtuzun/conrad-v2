# ACTIVE-MCBR-E005 DESIGN stage: the gate I4 world family ACTIVE_INSPECTION_OCCLUDED_V1 on DEVELOPMENT worlds.
# SYNTHETIC_ONLY. Purpose design: only development (and validation) seeds may be read on this path.
# docs/audits/I4_WORLD_FAMILY.md declares the family, the splits, the planner set and the metrics.
experiment_id: ACTIVE-MCBR-E005-DESIGN
stage: design
seeds: [8000000, 8000001, 8000002, 8000003, 8000004, 8000005, 8000006, 8000007, 8000008, 8000009, 8000010, 8000011, 8000012, 8000013, 8000014, 8000015, 8000016, 8000017, 8000018, 8000019, 8000020, 8000021, 8000022, 8000023]
hypothesis: on a family where the nominal route leaves the critical surface unresolved and only some candidate views resolve it, an information-seeking planner beats the fixed nominal route, random views and coverage-only on the target's actual hidden-state error
primary_metric: hidden_state_error_improvement
direction: higher
reference_arm: PRODUCTION
planners:
  - PRODUCTION
  - A-B1_fixed_inspection
  - A-B0_random
  - A-B2_coverage
  - A-B4_geometric_nbv
  - A-B5_entropy_nbv
  - A-B5b_entropy_nbv_predictive
  - A-B7_uncertainty_nbv
  - A-B6b_bayes_eig
  - A-B10_mcbr_full
# Matched budgets: same mission duration (time budget), same max plans per need (observation budget), same
# single structural sensor, same candidate generator / feasibility filter / PlanningRequest; energy and travel
# are measured, not capped, and reported per planner.
runtime:
  duration_s: 100.0
  control_period_s: 0.1
  max_plans_per_need: 4
  mcbr: {n_azimuth: 16, elevations_rad: [0.0, 0.35], min_visibility: 0.0}
workers: 12
decision_rule: >-
  Unit = one world (paired across planners). The reference arm "beats" a baseline on a metric iff the lower
  bound of the 95 % paired percentile-bootstrap CI (4000 resamples) of the benefit (reference better =
  positive) is > 0. Development results select nothing on their own; selection happens on the validation
  split (stage selection) and the final and OOD splits stay untouched until the integrator sequences them.
