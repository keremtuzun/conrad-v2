# Immutable seed partition for the FORMAL Unity gate I5 integrated missions. SYNTHETIC_ONLY.
# Created 2026-09-20. DO NOT EDIT: conrad.evaluation.partitions pins the digest of this file's canonical content
# (I5_UNITY_PARTITIONS_SHA256) and refuses to load a changed copy. A new split needs a new version.
#
# Why a file of its own: the final_test split of partitions_unity_gates.yaml (7800000-7800019) is fully
# allocated (7800000 I1, 7800001 I3, 7800002-7800013 I4, 7800014-7800016 I6, 7800017 flagship, 7800018-7800019
# I7), and the I5 python-kernel final seeds are spent by the surrogate experiments that read them
# (7600000-7600009 M1-ACTION-E002, 7900000-7900009 M1-ACTION-E003, 7700000-7700009 M1-ACTION-E004). Formal
# evidence needs worlds that no run has seen, so gate I5 gets its own held-out Unity worlds here.
#
# 7710000-7710009 was declared before any run used it. Before it was chosen, configs/, conrad/, scripts/,
# tests/, docs/ and artifacts/ were searched for every 5/6/7/8-million seed literal; nothing anywhere used
# 771xxxx, and no reserved_elsewhere range of any partition file covers it.
# Checked on load: disjoint from every seed of partitions.yaml, partitions_nav.yaml, partitions_i5.yaml,
# partitions_i5_v2.yaml, partitions_i5_v3.yaml and partitions_unity_gates.yaml, and from reserved_elsewhere.
version: partitions-i5-unity-2026-09-20-v1
families: [straight_pipeline]
scenarios: [I5-NOMINAL, I5-NOMINAL-READABLE, I5-CRITICAL-FINDING, I5-UNCERTAIN-BELIEF, I5-ROUTE-BLOCKED,
            I5-BATTERY-RESERVE, I5-TIME-RESERVE, I5-COMMS-OUTAGE]
world_seeds:
  development: {explicit: [], range: [7710100, 7710110]}
  final_test: {explicit: [], range: [7710000, 7710010]}
reserved_elsewhere:
  - {range: [5300000, 5300060], owner: partitions.yaml mission final_test (SPENT)}
  - {range: [6300000, 6300012], owner: 2E-E00x-R2 final}
  - {range: [6400000, 6400020], owner: 2E-E00x-R3 final}
  - {range: [6500000, 6500060], owner: 2T-E00x-R3 final (FINAL-3, SPENT)}
  - {range: [6600000, 6600020], owner: 2E-E00x-R4 final}
  - {range: [6700000, 6700060], owner: 2T-E00x-R4 final (FINAL-4)}
  - {range: [6900000, 7000001], owner: reserved for another workstream}
  - {range: [7100000, 7100010], owner: M1-ACTION-E001 development}
  - {range: [7300000, 7300010], owner: M1-ACTION-E001 final; former I2 NAV final}
  - {range: [7400001, 7410021], owner: partitions_nav.yaml noise seeds}
  - {range: [7600000, 7600010], owner: M1-ACTION-E002 final (SPENT)}
  - {range: [7700000, 7700010], owner: M1-ACTION-E004 final (partitions_i5_v3.yaml)}
  - {range: [7800000, 7810020], owner: partitions_unity_gates.yaml (formal Unity gates)}
  - {range: [7900000, 7900010], owner: M1-ACTION-E003 final (SPENT)}
  - {range: [8000000, 8000313], owner: partitions_i4_occluded.yaml (gate I4 occluded family)}
