# Spatial V1.1 visibility/localization remediation. DEVELOPMENT only; never
# gate evidence. Declared before seeds 8700000..8700009 were opened.
experiment_id: M1-ACTION-SPATIAL-V1-1-DEV-R6
hypothesis: >-
  On ten fresh development worlds, the versioned depth-five conservative
  visibility certificate, physically constrained EKF fix reacquisition, and
  endpoint-tolerance boundary contract produce at least six legitimate nominal
  intact warrants while preserving zero false intact, grounded action
  correctness, and closed-loop outcomes no worse than both frozen baselines.
partition: development
partition_domain: i5_mission_v10
seeds: [8700000, 8700001, 8700002, 8700003, 8700004,
        8700005, 8700006, 8700007, 8700008, 8700009]
scenarios: [I5-NOMINAL, I5-CRITICAL-FINDING, I5-UNCERTAIN-BELIEF, I5-ROUTE-BLOCKED,
            I5-BATTERY-RESERVE, I5-TIME-RESERVE, I5-COMMS-OUTAGE]
arms: [egdc_structured, rule_fsm, naive_act_on_claims]
latency_budget_s: {default: 4.0, I5-NOMINAL: 20.0}
success_floor: 0.9
uir_max: 0.0
contact_clearance_m: 0.3
workers: 5
keep_bundles: false
advancement_rule:
  primary_nominal_warrants_min: 6
  false_intact_on_covered_resolvable_defect_max: 0
  non_nominal_correct_given_warrant_rate_min: 1.0
  decision_violations_max: 0
  nominal_over_escalations_max: 0
  traceability_min: 1.0
  uir_max: 0.0
  competitiveness: >-
    EGDC pooled task success must be at least each frozen baseline, EGDC safety
    entries at most each frozen baseline, and EGDC decision violations at most
    each frozen baseline. Any safety outlier is inspected before validation.
spatial_v1:
  sensor_config: configs/sim/spatial_v1_synthetic_sensor_detectability_v2.json
  sensor_file_sha256: c7f68b08a008135d5a86961135c05930170c19f86d772b10094926f207877efe
  world:
    family: inspectable_pipeline
    survey_sigma_m: 0.0
    survey_endpoint_bound_m: null
  runtime:
    duration_s: 120.0
    cruise_speed_fraction: 0.4
    max_plans_per_need: 24
    decision: {max_information_attempts: 24}
    view_execution: {enabled: true, max_view_attempts: 24}
  runtime_by_scenario:
    I5-NOMINAL: {duration_s: 480.0}
  default_truth:
    axial_cells: 2
    sectors: 4
    base: {corrosion_depth_m: 0.0, crack_length_m: 0.0, crack_depth_m: 0.0}
  truth_by_scenario:
    I5-CRITICAL-FINDING: &covered_resolvable_defect
      axial_cells: 2
      sectors: 4
      cell_states:
        - {}
        - {}
        - {corrosion_depth_m: 0.008}
        - {corrosion_depth_m: 0.008}
        - {}
        - {}
        - {corrosion_depth_m: 0.008}
        - {corrosion_depth_m: 0.008}
    I5-COMMS-OUTAGE: *covered_resolvable_defect
  model2t:
    axial_cells: 2
    sectors: 4
    thresholds:
      corrosion_degraded_m: 0.002
      corrosion_severe_m: 0.006
      corrosion_failed_m: 0.012
      crack_degraded_m: 0.003
      crack_severe_m: 0.01
      crack_failed_m: 0.03
    required_looks: 1
    required_domain: {axial_fraction: [0.05, 0.95], sectors: [2, 3]}
limitations: [synthetic data only, python L1 kernel, development evidence only, physical calibration pending]
