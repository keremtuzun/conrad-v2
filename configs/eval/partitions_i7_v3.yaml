# Immutable gate I7 surrogate-mission seed partition, version 3 (COM-I7-E005 / COM-I7-E006). SYNTHETIC_ONLY.
# Created 2026-09-20. DO NOT EDIT: conrad.evaluation.partitions pins the digest of this file's canonical
# content (I7_V3_PARTITIONS_SHA256) and refuses to load a changed copy. A new split needs a new version.
#
# Why a new version: the v2 final_test seeds 5500000-5500004 are SPENT. COM-I7-E003 / COM-I7-E004 ran on them
# and their per-seed results were read (docs/audits/I7_COMMUNICATIONS.md). Two things changed afterwards and
# both were declared BEFORE this file was used:
#   1. I7-OUTAGE-CRITICAL's outage window now follows the critical finding instead of being the fixed
#      [6 s, 60 s). The fixed window could miss the event it exists to stress, and on seed 5500002 it did:
#      that world's finding was made at 68.1 s with the link already back, so it never exercised the outage
#      path at all. Criterion 2 numbers before and after this change are therefore not comparable.
#   2. Nothing in BAAC itself. The scheduler repair was frozen before the v2 run and is unchanged here.
#
# This file adds no development split: the I7 development runs keep using the `mission` development split of
# partitions.yaml, and both changes above were designed and verified on mission development seeds 5100000 and
# 5100001 only.
#
# final_test 5600000-5600004 was declared before any run used it. Before it was chosen, configs/, conrad/,
# scripts/, tests/ and docs/ were searched for every 5/6/7/8-million seed literal; the used 5-million bands
# are 5000000, 5100000-5400040 and 5500000-5500004, and nothing anywhere used 56xxxxx. The other used bands
# are 6100000-6700060, 6900000-7000000, 7100000-7100010, 7300000-7300010, 7400001-7410021,
# 7500000-7500010, 7600000-7600010, 7700000-7700010, 7710000-7710002, 7800000-7820000, 7900000-7900010 and
# 8000000-8000313. Checked on load: disjoint from every seed of partitions.yaml, partitions_nav.yaml,
# partitions_i5.yaml, partitions_i5_v2.yaml, partitions_i5_v3.yaml, partitions_i5_unity.yaml,
# partitions_unity_gates.yaml, partitions_i4_occluded.yaml and partitions_i7_v2.yaml, and from every range
# under reserved_elsewhere.
version: partitions-i7-comms-2026-09-20-v3
scenarios: [I7-BANDWIDTH, I7-OUTAGE-CRITICAL]
world_seeds:
  final_test: {explicit: [], range: [5600000, 5600005]}
reserved_elsewhere:
  - {range: [5000000, 5000001], owner: scratch timing seed}
  - {range: [5300000, 5300060], owner: partitions.yaml mission final_test (SPENT, COM-I7-E001/E002)}
  - {range: [5500000, 5500005], owner: partitions_i7_v2.yaml (SPENT, COM-I7-E003/E004)}
