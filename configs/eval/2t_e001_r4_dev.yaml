# 2T-E001-R4-DEV (SYNTHETIC_ONLY; REALISTIC Twin2T sensor; docs/audits/MODEL2T_REPAIR.md iteration 4). DEVELOPMENT seeds: design only, never evidence.
experiment: {id: 2T-E001-R4-DEV}
partition: development
purpose: design
# Config-local 2T partitions (iteration 4; configs/eval/partitions.yaml is digest-pinned). Disjoint. The R2
# FINAL seeds 5300000-5300059 and the R3 FINAL-3 seeds 6500000-6500059 were both inspected in their write-ups,
# so both are SPENT and never read again. final_4 (6700000-6700059) was checked against every seed range in
# configs/, conrad/, scripts/, tests/, docs/ and artifacts/ BEFORE it was declared, and before any R4 run
# (docs/audits/MODEL2T_REPAIR.md iteration 4). 6300000-6700060 is the range partitions_i4_occluded.yaml
# reserves for the 2E/2T repeat finals; 2E-R4 took 6600000-6600019.
partitions:
  development: {range: [5100000, 5100040]}
  validation: {range: [5200000, 5200040]}
  final_4: {range: [6700000, 6700060]}
  spent_final: {range: [5300000, 5300060]}
  spent_final_3: {range: [6500000, 6500060]}
seeds: [5100000, 5100001, 5100002, 5100003, 5100004, 5100005, 5100006, 5100007, 5100008, 5100009, 5100010, 5100011, 5100012, 5100013, 5100014, 5100015, 5100016, 5100017, 5100018, 5100019, 5100020, 5100021, 5100022, 5100023, 5100024, 5100025, 5100026, 5100027, 5100028, 5100029]
scenario: {kind: tier, tier: 3}
episodes_per_seed: 3
steps: 16
dt_days: 60
coverage: 0.8
degradation_levels: [0.0, 0.4]
gru: true
gru_training:
  train_seed: 5100039  # DEVELOPMENT seed, excluded from the DEV evaluation list
  scenario: {kind: tier, tier: 3}
  steps: 16
  dt_days: 60
  coverages: [0.8]
  gru: {hidden: 16, epochs: 150, lr: 0.01, train_episodes: 6}
# Declared BEFORE the final run: 95% interval coverage of Model2T must lie in this band.
coverage_band: [0.90, 0.99]
hypothesis: "Model2T direct inference (sensor-characterised) has lower MAE than latest-observation for corrosion and crack, with calibrated 95% intervals"
primary_metric: "paired MAE gain (latest - model) per seed, bootstrap 95% CI"
baselines: [LATEST_OBSERVATION, LATEST_OBSERVATION_DEBIASED, SINGLE_FRAME, GRU_TEMPORAL, MODEL2T_ABSOLUTE]
