# 2E-E002 entity cover estimation under turbidity (SYNTHETIC_ONLY Twin2E small world)
experiment: {id: 2E-E002}
seeds: [2026201, 2026202, 2026203]
twin_config: configs/sim/twin2e_test_small.yaml
turbidity_levels_ntu: [1.0, 4.0, 10.0, 25.0]
variants: [cefd, uncoupled, entity_only]
n_steps: 96
dt_s: 900.0
eval_every_steps: 12
n_moorings: 3
