# Immutable gate I7 surrogate-mission seed partition, version 2 (COM-I7-E003 / COM-I7-E004). SYNTHETIC_ONLY.
# Created 2026-09-20. DO NOT EDIT: conrad.evaluation.partitions pins the digest of this file's canonical
# content (I7_V2_PARTITIONS_SHA256) and refuses to load a changed copy. A new split needs a new version.
#
# Why a new version: the I7 surrogate (COM-I7-E001 / COM-I7-E002) ran on the partitions.yaml mission
# final_test seeds 5300000-5300004 and its per-seed results were read (docs/audits/I7_COMMUNICATIONS.md).
# Those seeds, and the whole 5300000-5300059 mission final_test range, are SPENT. The BAAC scheduler repair
# of 2026-09-20 (bounded ch19 Level 0/1 pre-emption plus the receiver-relative value model) changes BAAC's
# behaviour, so that surrogate evidence is stale and has to be produced once more on fresh held-out seeds.
#
# The repair was diagnosed and fixed on the mission DEVELOPMENT seeds 5100000 and 5100001 only; this file
# adds no development split, because the I7 development runs keep using the `mission` development split of
# partitions.yaml. It declares final_test seeds only, and they are declared here BEFORE any run touched them.
#
# final_test 5500000-5500004 was declared before any run used it. Before it was chosen, configs/, conrad/,
# scripts/, tests/, docs/ and artifacts/ were searched for every 5/6/7/8-million seed literal; the used bands
# are 5000000, 5100000-5400040, 5300000-5300060, 6100000-6700060, 6900000-7000000, 7100000-7100010,
# 7300000-7300010, 7400001-7410021, 7500000-7500010, 7600000-7600010, 7700000-7700010, 7710000-7710002,
# 7800000-7820000, 7900000-7900010 and 8000000-8000313, and nothing anywhere used 55xxxxx.
# Checked on load: disjoint from every seed of partitions.yaml, partitions_nav.yaml, partitions_i5.yaml,
# partitions_i5_v2.yaml, partitions_i5_v3.yaml, partitions_i5_unity.yaml, partitions_unity_gates.yaml and
# partitions_i4_occluded.yaml, and from every range under reserved_elsewhere.
version: partitions-i7-comms-2026-09-20-v2
scenarios: [I7-BANDWIDTH, I7-OUTAGE-CRITICAL]
world_seeds:
  final_test: {explicit: [], range: [5500000, 5500005]}
reserved_elsewhere:
  - {range: [5000000, 5000001], owner: scratch timing seed}
  - {range: [5300000, 5300060], owner: partitions.yaml mission final_test (SPENT, COM-I7-E001/E002)}
  - {range: [6300000, 6300012], owner: 2E-E00x-R2 final}
