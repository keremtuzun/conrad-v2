  - {range: [6300000, 6300012], owner: 2E-E00x-R2 final}
  - {range: [6400000, 6400020], owner: 2E-E00x-R3 final}
  - {range: [6500000, 6500060], owner: 2T-E00x-R3 final (FINAL-3, SPENT)}
  - {range: [6600000, 6600020], owner: 2E-E00x-R4 final}
  - {range: [6700000, 6700060], owner: 2T-E00x-R4 final (FINAL-4)}
