# 2T-E002-R3 (SYNTHETIC_ONLY; REALISTIC Twin2T sensor; docs/audits/MODEL2T_REPAIR.md iteration 3). FINAL-3 seeds: run ONCE after freezing the design.
experiment: {id: 2T-E002-R3}
partition: final_3
purpose: final_evaluation
# Config-local 2T partitions (iteration 3; configs/eval/partitions.yaml is digest-pinned). Disjoint. The R2
# FINAL seeds 5300000-5300059 were inspected in the R2 write-up, so they are SPENT and never read again.
# final_3 was checked against every seed range in configs/ before it was declared (docs/audits/MODEL2T_REPAIR.md).
partitions:
  development: {range: [5100000, 5100040]}
  validation: {range: [5200000, 5200040]}
  final_3: {range: [6500000, 6500060]}
  spent_final: {range: [5300000, 5300060]}
seeds: [6500000, 6500001, 6500002, 6500003, 6500004, 6500005, 6500006, 6500007, 6500008, 6500009, 6500010, 6500011, 6500012, 6500013, 6500014, 6500015, 6500016, 6500017, 6500018, 6500019]  # first 20 FINAL-3 seeds: B2 is refit per seed (~70 s each)
scenario: {kind: tier, tier: 3}
coverages: [0.5, 0.2, 0.05]
episodes_per_seed: 2
steps: 20
dt_days: 45
gru: {hidden: 16, epochs: 150, lr: 0.01, train_episodes: 6}
# Declared before the run: Model2T arms scored on their internal estimate, only on items every arm estimates.
scoring: paired_latent
