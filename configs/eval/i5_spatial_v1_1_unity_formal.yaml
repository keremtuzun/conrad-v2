# Spatial V1.1 FORMAL Unity I5 cycle. Sealed before any v3 formal world was opened.
experiment_id: I5-SPATIAL-V1-1-UNITY-FORMAL
hypothesis: >-
  On two fresh Unity worlds, frozen Spatial V1.1 exercises every declared I5
  action scenario correctly, retains complete traceability and UIR 0, produces
  no false intact or decision violations, and is no worse than both frozen
  decision baselines on pooled task success, safety entries, and violations.
partition: final_test
partition_domain: i5_unity_v3
partition_file: configs/eval/partitions_i5_unity_v3.yaml
final_worlds: [8701000, 8701001]
unused_final_worlds: [8701002, 8701003, 8701004, 8701005, 8701006, 8701007, 8701008, 8701009]
scenarios: [I5-NOMINAL, I5-CRITICAL-FINDING, I5-UNCERTAIN-BELIEF, I5-ROUTE-BLOCKED,
            I5-BATTERY-RESERVE, I5-TIME-RESERVE, I5-COMMS-OUTAGE]
arms: [egdc_structured, rule_fsm, naive_act_on_claims]
latency_budget_s: {default: 4.0, I5-NOMINAL: 20.0}
success_floor: 0.9
uir_max: 0.0
contact_clearance_m: 0.3
matrix_artifact: artifacts/experiments/M1-ACTION-E001/m1_action_e001.json
surrogate_final:
  result_sha256: 0dbc96d699a698ed95011330692533312094d941b5e3fb9c9bf25a965e10e3d1
  verification_sha256: 39d5252fd8313da6ece3fd057e55077e3b6c3b94ec8e29645e1779822faec203
  status: PASS
player:
  platform: macOS universal Mach-O (arm64 host)
  executable_sha256: 7e42f64199b043204d62737d06aabc6b6ceb1f3c1c699f158a612b938ea87ac6
formal_rule:
  expected_rows: 42
  all_ten_existing_criteria_must_pass: true
  every_scenario_warrants_min: 2
  every_scenario_correct_given_warrant_rate_min: 0.9
  false_intact_on_covered_resolvable_defect_max: 0
  decision_violations_max: 0
  nominal_over_escalations_max: 0
  traceability_min: 1.0
  uir_max: 0.0
  competitiveness: >-
    EGDC pooled task success must be at least each frozen baseline, EGDC safety
    entries at most each frozen baseline, and EGDC decision violations at most
    each frozen baseline.
  required_evidence: [exact grid, player identity, spatial runtime, replay, leakage scan]
  stop_rule: >-
    Run all 42 rows sequentially, one Unity player at a time. Resume only a
    completed bundle; never re-fly a completed row. Any missing or duplicate
    row, player mismatch, failed criterion, replay mismatch, or leakage is a
    formal FAIL. Do not add unused worlds or change thresholds after observation.
spatial_v1:
  sensor_config: configs/sim/spatial_v1_synthetic_sensor_detectability_v2.json
  sensor_file_sha256: c7f68b08a008135d5a86961135c05930170c19f86d772b10094926f207877efe
  world:
    family: inspectable_pipeline
    survey_sigma_m: 0.0
    survey_endpoint_bound_m: null
  runtime:
    duration_s: 120.0
    cruise_speed_fraction: 0.4
    max_plans_per_need: 24
    decision: {max_information_attempts: 24}
    view_execution: {enabled: true, max_view_attempts: 24}
  runtime_by_scenario:
    I5-NOMINAL: {duration_s: 480.0}
  default_truth:
    axial_cells: 2
    sectors: 4
    base: {corrosion_depth_m: 0.0, crack_length_m: 0.0, crack_depth_m: 0.0}
  truth_by_scenario:
    I5-CRITICAL-FINDING: &covered_resolvable_defect
      axial_cells: 2
      sectors: 4
      cell_states:
        - {}
        - {}
        - {corrosion_depth_m: 0.008}
        - {corrosion_depth_m: 0.008}
        - {}
        - {}
        - {corrosion_depth_m: 0.008}
        - {corrosion_depth_m: 0.008}
    I5-COMMS-OUTAGE: *covered_resolvable_defect
  model2t:
    axial_cells: 2
    sectors: 4
    thresholds:
      corrosion_degraded_m: 0.002
      corrosion_severe_m: 0.006
      corrosion_failed_m: 0.012
      crack_degraded_m: 0.003
      crack_severe_m: 0.01
      crack_failed_m: 0.03
    required_looks: 1
    required_domain: {axial_fraction: [0.05, 0.95], sectors: [2, 3]}
limitations: [synthetic data only, Unity L1 approximate physics, two-world formal sweep, physical calibration pending]
