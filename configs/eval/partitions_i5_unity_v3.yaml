# added after observing the result.
version: partitions-i5-unity-2026-09-26-v3
families: [inspectable_pipeline]
scenarios: [I5-NOMINAL, I5-CRITICAL-FINDING, I5-UNCERTAIN-BELIEF, I5-ROUTE-BLOCKED,
            I5-BATTERY-RESERVE, I5-TIME-RESERVE, I5-COMMS-OUTAGE]
world_seeds:
  development: {explicit: [], range: [8701100, 8701110]}
  final_test: {explicit: [], range: [8701000, 8701010]}
reserved_elsewhere:
