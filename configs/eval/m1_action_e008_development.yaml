# Full I5 repair verification on the v6 DEVELOPMENT split only. Never gate evidence.
experiment_id: M1-ACTION-E008-DEVELOPMENT
hypothesis: >-
  An accepted information-acquisition goal for the same target is represented in Model 1's decision context,
  so exhausted request count does not trigger escalation while that acquisition is genuinely in flight, while
  normal finite-attempt fallback resumes as soon as the goal closes or fails. The existing calibration revision
  and independent-observation requirements, MCBR feasibility rules, safety constraints, and baselines remain
  unchanged. Correctness is thresholded given a warrant; raw action rate and warrant coverage remain explicit,
  and a scored scenario with zero warrants fails.
partition: development
partition_domain: i5_mission_v6
seeds: [7740000, 7740001, 7740002, 7740003, 7740004, 7740005, 7740006, 7740007, 7740008, 7740009]
scenarios: [I5-NOMINAL, I5-NOMINAL-READABLE, I5-CRITICAL-FINDING, I5-UNCERTAIN-BELIEF, I5-ROUTE-BLOCKED,
            I5-BATTERY-RESERVE, I5-TIME-RESERVE, I5-COMMS-OUTAGE]
arms: [egdc_structured, rule_fsm, naive_act_on_claims]
latency_budget_s: {default: 4.0, I5-NOMINAL: 20.0, I5-NOMINAL-READABLE: 20.0}
success_floor: 0.9
uir_max: 0.0
contact_clearance_m: 0.3
workers: 6
keep_bundles: false
limitations: [synthetic data only, python L1 kernel, development evidence only]
