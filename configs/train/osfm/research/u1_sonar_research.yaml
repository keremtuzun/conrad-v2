job: osfm_u1_sonar_research
stage_id: U1-SONAR-RESEARCH
scale: full
formal_run_allowed: true
full_run_allowed: true
rehearsal_only: false
promotable: true
require_clean_git: true
required_compute: CUDA GPU with >=16 GB VRAM
min_vram_gb: 16
p47_go_artifact: artifacts/gates/P4.7D_L4/osfm_readiness.json
corpus: configs/data/osfm/public_real_subpipe_p47b.yaml
evidence: configs/data/osfm/subpipe_p47b_evidence.json
init: artifacts/external/dinov2/dinov2_vits14.pth
stream: sss_lf
image_size: 28
batch_size: 64
gradient_accumulation: 4
validation_support: 96
optimizer_steps: 100000
validation_every_steps: 1000
seed: 2026092618
blocked_until: []
required_parents:
  - generic_rgb_initialization_policy_resolved
required_partitions:
  - PRETRAIN_REAL
  - VALIDATION
required_modalities:
  - sonar
initialization_policy:
  patch_projection: independent_or_recorded_rgb_transform_digest
  transformer: may_inherit_generic_rgb_weights_with_recorded_digest
  independence_evidence: U1-SONAR validation metrics and separate checkpoint ancestry
objectives:
  - teacher_student_mse
  - mask_reconstruction
optimizer:
  family: AdamW
  learning_rates:
    encoder: 0.0001
    heads: 0.0003
  weight_decay: 0.05
  schedule: warmup_5pct_cosine_by_optimizer_step
  grad_clip_norm: 1.0
lr: 0.0001
weight_decay: 0.05
grad_clip_norm: 1.0
token_mask_fraction: 0.6
min_visible_fraction: 0.1
noise_std: 0.025
representation_health:
  min_independent_representations: 64
  min_effective_rank: 64
  rank_diversity_weight: 1.0
  rank_diversity_target: 72
  select_best_validation_rank_checkpoint: true
  fail_closed_on_rank_regression: true
rank_diversity_weight: 1.0
rank_diversity_target: 72
variance_weight: 2.0
covariance_weight: 0.05
variance_target_std: 1.0
select_best_validation_rank_checkpoint: true
budget:
  batch_size_per_gpu: 64
  gradient_accumulation: 4
  effective_batch_target: 256
  optimizer_steps: 100000
validation:
  every_steps: 1000
  selection_metric: validation_effective_rank_then_val_ssl_total
promotion:
  produces: U1-SONAR-RESEARCH-CHECKPOINT
  requires_clean_git: true
  final_or_ood_training_access: forbidden
notes:
  - Full P4.8 U1 sonar research launch remains fail-closed unless all gate checks pass at runtime.
  - Training reads PRETRAIN_REAL only; validation reads VALIDATION only.
  - FINAL_TEST and OOD_TEST are forbidden for training, sampler, and normalization statistics.
  - SubPipe sonar is rendered side-scan imagery, not raw acoustic backscatter.
  - P4.8H failed the formal representation rank guard; this config adds rank-diversity pressure and selects the best validation-rank checkpoint without using FINAL_TEST or OOD_TEST.
