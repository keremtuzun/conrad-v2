stage_id: M1-RESEARCH
scale: full
formal_run_allowed: false
promotable: false
blocked_until:
  - EXT-DATA-PUBLIC-REAL-01
  - EXT-COMPUTE-P4-RESEARCH-01
required_parents:
  - U1-RGB-RESEARCH
  - U1-SONAR-RESEARCH
  - U1-RANGE-RESEARCH
  - U1-GEOMETRY-RESEARCH
objectives:
  - global_consistency
  - cross_modal_consistency
  - missing_modality
optimizer:
  family: AdamW
  learning_rates:
    fusion: 0.0002
    adapters: 0.0003
    unfrozen_u1: 0.00005
  weight_decay: 0.05
  schedule: warmup_5pct_cosine_by_optimizer_step
budget:
  batch_size_per_gpu: 32
  gradient_accumulation: 8
  effective_batch_target: 256
  optimizer_steps: 120000
validation:
  every_steps: 1000
  selection_metric: validation_effective_rank_then_val_ssl_total
representation_health:
  min_independent_representations: 64
  min_effective_rank: 64
  rank_diversity_weight: 1.0
  rank_diversity_target: 72
  select_best_validation_rank_checkpoint: true
  fail_closed_on_rank_regression: true
fusion_health:
  require_per_modality_contribution: true
  require_modality_balance_review: true
  require_missing_modality_ablation: true
promotion:
  produces: M1-RESEARCH-CHECKPOINT
  requires_clean_git: true
