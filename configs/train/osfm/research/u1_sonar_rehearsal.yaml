lr: 0.0001
weight_decay: 0.05
grad_clip_norm: 1.0
token_mask_fraction: 0.60
min_visible_fraction: 0.10
noise_std: 0.025
partition_access:
  train:
    - PRETRAIN_REAL
  validation:
    - VALIDATION
  forbidden_training_access:
    - FINAL_TEST
    - OOD_TEST
notes:
  - P4.8A is a governed real-data rehearsal, not the full 100k-step formal U1 run.
  - PRETRAIN_REAL trains; VALIDATION selects/checks; FINAL_TEST and OOD_TEST are not loaded.
  - SubPipe sonar is rendered side-scan imagery, not raw acoustic backscatter.
  - Full P4.8 remains locked until this rehearsal evidence is committed and reviewed.
