job: osfm_u1_sonar_research
stage_id: P4.8A-U1-SONAR-REAL-REHEARSAL
scale: full
formal_run_allowed: true
rehearsal_only: true
require_clean_git: true
required_compute: "1x CUDA GPU >= 16 GB VRAM (EXT-COMPUTE-P4-RESEARCH-01)"
min_vram_gb: 16
