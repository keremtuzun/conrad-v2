stage_id: U1-RANGE-RESEARCH
scale: full
formal_run_allowed: false
promotable: false
blocked_until:
  - EXT-DATA-PUBLIC-REAL-01
  - EXT-COMPUTE-P4-RESEARCH-01
required_partitions:
  - PRETRAIN_REAL
  - VALIDATION
required_modalities:
  - range
objectives:
  - teacher_student_mse
  - mask_reconstruction
  - metric_reconstruction
optimizer:
  family: AdamW
  learning_rates:
    encoder: 0.0001
    heads: 0.0003
  weight_decay: 0.05
  schedule: warmup_5pct_cosine_by_optimizer_step
  grad_clip_norm: 1.0
budget:
  batch_size_per_gpu: 64
  gradient_accumulation: 4
  effective_batch_target: 256
  optimizer_steps: 80000
validation:
  every_steps: 1000
  selection_metric: validation_effective_rank_then_val_ssl_total
representation_health:
  min_independent_representations: 64
  min_effective_rank: 64
  rank_diversity_weight: 1.0
  rank_diversity_target: 72
  select_best_validation_rank_checkpoint: true
  fail_closed_on_rank_regression: true
promotion:
  produces: U1-RANGE-RESEARCH-CHECKPOINT
  requires_clean_git: true
