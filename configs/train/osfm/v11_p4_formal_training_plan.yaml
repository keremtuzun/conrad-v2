plan_id: OSFM-UNIVERSAL-V1.1-P4
stage_id: V1.1-P4-FORMAL-TRAINING-PLAN
status: PLANNED_FAIL_CLOSED
formal_training_allowed: false
full_run_allowed: false
may_start_after:
  - V1.1-P4-8L4-PARALLEL-BENCHMARK: GO
  - projected_conservative_800k_steps_hours_lt_24: true
  - projected_conservative_800k_steps_cost_try_lt_8500: true
  - all_registry_items_rank_ge_75: true
  - p4_v1_line_untouched: true
source_constraints:
  architecture: OceanSense OS-FM Universal V1.1
  branch: osfm-universal-v1.1
  d_f: 384
  scene_latents: 64
  encoder_family_count: 15
  registered_modality_count: 829
  min_effective_rank: 75.0
  exact_evidence_replaces_learned_representation: false
  exact_evidence_parallel_path_required: true
  sample_lab_result_path_required: true
  final_test_or_ood_training_access: forbidden
  p4_v1_line_contamination: forbidden
compute_target:
  accelerator: NVIDIA_L4
  gpu_count: 8
  preferred_machine_type: g2-standard-96
  distributed_backend: torchrun_ddp
  max_wall_clock_hours: 24.0
  max_total_cost_try: 8500.0
  pricing_policy: live_price_checked_at_launch
  launch_policy: fail_closed_unless_measured_projection_fits_time_and_budget
training_budget:
  total_optimizer_steps: 800000
  total_status: hard_cap_until_revised_by_measured_benchmark
  effective_batch_target: 256
  selection_metric: validation_effective_rank_then_val_ssl_total
  validation_every_steps: 1000
  checkpoint_every_steps: 5000
  select_best_validation_rank_checkpoint: true
  fail_closed_on_rank_regression: true
step_allocation:
  - stage: V11-P4-A-v1-import-and-sonar-anchor
    optimizer_steps: 10000
    purpose: verify V1-compatible sonar/RGB/range/geometry/context imports and keep sonar as initial anchor
    trainable_scope: adapters_router_small_heads_only
    required_inputs:
      - final_or_selected_sonar_rankfix_checkpoint
      - v1_compatibility_bank
    gates:
      min_effective_rank: 75.0
      checkpoint_reload_exact_match: true
  - stage: V11-P4-B-family-local-calibration
    optimizer_steps: 150000
    purpose: calibrate all 15 reusable encoder families without claiming every registered modality is pretrained
    trainable_scope: family_tokenizers_family_encoders_adapters
    per_family_steps: 10000
    family_count: 15
    gates:
      every_family_rank_ge: 75.0
      every_family_routeable: true
  - stage: V11-P4-C-universal-mixed-modality-pretraining
    optimizer_steps: 300000
    purpose: train universal adapters, family fusion, dynamic routing, and global scene fusion on mixed synthetic/public-real manifests
    trainable_scope: universal_adapters_family_fusion_router_global_fusion
    gates:
      all_available_registry_batches_rank_ge: 75.0
      missing_degraded_unsupported_states_pass: true
      correspondence_graph_objectives_physically_eligible_only: true
  - stage: V11-P4-D-async-temporal-evidence-cotraining
    optimizer_steps: 150000
    purpose: train async timestamp alignment, temporal memory integration, evidence bypass, and sample/lab-result path behavior
    trainable_scope: aligner_temporal_memory_evidence_heads_router
    gates:
      stale_invalid_uncalibrated_saturated_states_pass: true
      exact_evidence_path_numerically_preserved: true
      sample_lab_result_path_preserved: true
  - stage: V11-P4-E-router-fusion-joint-alignment
    optimizer_steps: 150000
    purpose: stabilize sparse routing, family/local fusion, global fusion, and cross-modal eligibility objectives
    trainable_scope: router_family_fusion_global_fusion_alignment_heads
    gates:
      all_15_families_contribute_when_available: true
      invalid_relations_skipped_by_correspondence_graph: true
      rank_ge: 75.0
  - stage: V11-P4-F-stabilization-selection
    optimizer_steps: 40000
    purpose: final validation-rank selection, checkpoint reload validation, ablation checks, and promotion package
    trainable_scope: full_v11_universal_trainable_set_except_frozen_imported_v1_if_configured
    gates:
      selected_checkpoint_rank_ge: 75.0
      final_step_rank_ge: 75.0
      checkpoint_reload_exact_match: true
      no_formal_v1_branch_changes: true
promotion:
  produces: OSFM-UNIVERSAL-V1.1-P4-CANDIDATE
  not_yet_p4_12_final: true
  requires:
    - completed_800000_steps_or_governed_revised_plan
    - full_registry_rank_report
    - all_family_rank_report
    - checkpoint_reload_report
    - exact_evidence_path_report
    - sample_lab_result_path_report
    - missing_degraded_unsupported_state_report
    - async_timing_report
    - correspondence_graph_report
    - cost_report
    - p4_v1_noncontamination_report
do_not_start_if:
  - 8_l4_benchmark_missing
  - measured_projection_over_24h
  - measured_projection_over_8500_try
  - rank_below_75
  - registry_coverage_incomplete
  - p4_v1_line_dirty_or_modified_by_v11_run
  - exact_evidence_path_not_verified
  - sample_lab_path_not_verified
  - checkpoint_reload_not_verified
notes:
  - Step allocation is a governed V1.1 P4 plan, not completed training evidence.
  - The 800k step cap is conservative and may only be reduced after measured 8-L4 throughput and rank evidence.
  - Registered-but-inactive modalities stay registered; benchmark coverage proves interface/routing coverage, not semantic pretraining for every rare sensor.
