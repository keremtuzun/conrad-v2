plan_id: OSFM-UNIVERSAL-V1.1-20P
stage_id: V1.1-P4-20P-OPTIMAL-CANDIDATE
status: PLANNED_FAIL_CLOSED_20P
formal_training_allowed: false
full_v11_claim_allowed: false
purpose: optimal_20_percent_candidate_run_under_budget_constraints
parent_full_plan: OSFM-UNIVERSAL-V1.1-P4-FULL
source_constraints:
  architecture: OceanSense OS-FM Universal V1.1
  full_v11_steps: 3600000
  twenty_percent_steps: 720000
  compression_policy: weighted_curriculum_not_flat_twenty_percent
  d_f: 384
  scene_latents: 64
  encoder_family_count: 15
  registered_modality_count: 829
  min_effective_rank: 75.0
  exact_evidence_parallel_path_required: true
  learned_representations_may_not_replace_exact_evidence: true
  registry_interface_coverage_not_semantic_pretraining: true
  p4_v1_line_contamination: forbidden
compute_target:
  accelerator: NVIDIA_L4
  gpu_count_minimum: 8
  preferred_machine_type: g2-standard-96
  distributed_backend: torchrun_ddp
  max_wall_clock_hours: 24.0
  max_total_cost_try: 8500.0
  launch_policy: start_only_if_8l4_benchmark_projects_720k_steps_under_time_and_budget
training_budget:
  total_optimizer_steps: 720000
  effective_batch_target: 256
  validation_every_steps: 1000
  checkpoint_every_steps: 5000
  selection_metric: validation_effective_rank_then_val_ssl_total
  select_best_validation_rank_checkpoint: true
  fail_closed_on_rank_regression: true
  rank_floor: 75.0
optimization_strategy:
  protect_imported_v1_and_selected_sonar_anchor: true
  prioritize_shared_modules: true
  prioritize_data_backed_families: true
  keep_rare_families_routeable_but_light: true
  curriculum_order:
    - imported_anchor_and_family_local_rank
    - high_data_active_modalities
    - mixed_modality_dropout_and_routing
    - async_evidence_lab_paths
    - joint_stabilization_and_selection
family_priority:
  high:
    - active_acoustic
    - visual_image
    - geometry_spatial
    - physical_oceanographic_time_series
    - chemical_electrochemical_spectral
    - ultrasonic_ndt
    - mechanical_structural_time_series
  medium:
    - spectral_photonic
    - electromagnetic_magnetic
    - passive_acoustic_vibration
    - engineering_document_context
  light:
    - biological_molecular
    - microscopic_particle
    - geophysical_seismic
    - radiological
step_allocation:
  - stage: V11-20P-A-v1-import-and-sonar-anchor
    optimizer_steps: 10000
    purpose: load/verify V1-compatible paths and selected sonar rank-fix anchor without contaminating P4 V1
    trainable_scope: adapters_router_small_heads_only
    gates:
      min_effective_rank: 75.0
      checkpoint_reload_exact_match: true
      p4_v1_line_untouched: true
  - stage: V11-20P-B-weighted-family-local-pretraining
    optimizer_steps: 180000
    purpose: train all 15 families enough to stay routeable, with extra pressure on high-priority/data-backed families
    trainable_scope: family_tokenizers_family_encoders_adapters
    gates:
      all_15_families_routeable: true
      every_family_rank_ge: 75.0
      no_family_nan_or_collapse: true
  - stage: V11-20P-C-active-modality-curriculum
    optimizer_steps: 140000
    purpose: focus active/high-priority modalities and data-backed adapters, without claiming semantic training for every registry item
    trainable_scope: modality_adapters_family_heads_data_specific_normalizers
    coverage_policy: active_or_data_backed_modalities_only
    gates:
      active_modality_batches_rank_ge: 75.0
      registered_but_inactive_list_generated: true
      no_claim_that_all_829_modalities_are_semantically_pretrained_without_data: true
  - stage: V11-20P-D-shared-universal-routing-and-fusion
    optimizer_steps: 160000
    purpose: spend heavily on shared router, family fusion, global Perceiver fusion, mixed-modality dropout, and missing/degraded behavior
    trainable_scope: universal_adapters_family_fusion_router_global_fusion
    gates:
      router_no_single_family_collapse: true
      all_available_registry_batches_rank_ge: 75.0
      missing_degraded_unsupported_failed_states_pass: true
  - stage: V11-20P-E-async-evidence-and-lab-paths
    optimizer_steps: 90000
    purpose: protect async alignment, exact-evidence bypass, sample/lab-result path, stale/invalid/uncalibrated/saturated state handling
    trainable_scope: aligner_temporal_memory_evidence_heads_router
    gates:
      timestamp_skew_tests_pass: true
      exact_evidence_path_numerically_preserved: true
      sample_lab_result_path_preserved: true
      learned_path_does_not_override_typed_measurements: true
  - stage: V11-20P-F-correspondence-alignment
    optimizer_steps: 80000
    purpose: train physically meaningful cross-family/self-supervised alignments only where the correspondence graph permits them
    trainable_scope: correspondence_heads_router_family_fusion_global_fusion
    gates:
      invalid_relations_skipped_by_correspondence_graph: true
      positive_relations_have_measurable_alignment_signal: true
      rank_ge: 75.0
  - stage: V11-20P-G-joint-stabilization-and-selection
    optimizer_steps: 50000
    purpose: stabilize full candidate behavior, router balance, family contribution, and checkpoint selection
    trainable_scope: full_v11_universal_trainable_set_except_frozen_imported_v1_if_configured
    gates:
      all_15_families_contribute_when_available: true
      missing_modality_ablation_pass: true
      degraded_state_ablation_pass: true
      selected_checkpoint_rank_ge: 75.0
  - stage: V11-20P-H-final-package
    optimizer_steps: 10000
    purpose: final reload validation, reports, cost reconciliation, and candidate promotion package
    trainable_scope: final_selection_no_new_data_split_access
    gates:
      final_step_rank_ge: 75.0
      checkpoint_reload_exact_match: true
      full_registry_interface_report_complete: true
      registered_but_inactive_report_complete: true
promotion:
  produces: OSFM-UNIVERSAL-V1.1-20P-CANDIDATE
  may_be_used_as_v11_candidate_checkpoint: true
  may_be_called_full_v11: false
  requires:
    - completed_720000_steps_or_governed_revised_20p_plan
    - selected_checkpoint_rank_ge_75
    - full_registry_interface_coverage_report
    - active_modality_semantic_training_report
    - registered_but_inactive_modality_report
    - exact_evidence_path_report
    - sample_lab_result_path_report
    - modality_state_report
    - async_timing_report
    - correspondence_graph_report
    - cost_report
    - p4_v1_noncontamination_report
do_not_start_if:
  - 8_l4_benchmark_missing
  - measured_projection_over_24h
  - measured_projection_over_8500_try
  - rank_below_75
  - registry_coverage_incomplete
  - p4_v1_line_dirty_or_modified_by_v11_run
  - exact_evidence_path_not_verified
  - sample_lab_path_not_verified
  - checkpoint_reload_not_verified
notes:
  - 20P is the optimized 20 percent candidate run: 720k steps from the 3.6M full V1.1 plan.
  - This is intentionally weighted toward anchors and shared modules instead of applying a flat 20 percent to every family/modality.
  - It should produce the strongest budget-realistic V1.1 candidate, but it is not the full semantic V1.1 training run.
