stage_id: V1.1-P4-1L4-10P-FALLBACK-BENCHMARK
plan_id: OSFM-UNIVERSAL-V1.1-P4
scale: bounded_benchmark
formal_training_allowed: false
full_run_allowed: false
promotable: false
purpose: measure_real_1_l4_throughput_rank_memory_and_cost_before_any_1_2m_v11_10p_fallback_training
fallback_for: configs/train/osfm/v11_p4_8l4_parallel_benchmark.yaml
required_branch: osfm-universal-v1.1
required_compute:
  accelerator: NVIDIA_L4
  gpu_count: 1
  machine_type_preferred: g2-standard-12
  min_vram_gb_per_gpu: 22
  distributed_backend: single_process_cuda
  capacity_window: any_time_quota_and_capacity_allow_one_l4
required_evidence:
  local_registry_benchmark: artifacts/gates/V1.1/v11_registry_benchmark_local_strict.json
  local_pillar_benchmark: artifacts/gates/V1.1/v11_pillar_benchmark_local_strict.json
  min_registry_coverage: 829
  min_local_registry_rank: 75.0
budget_guard:
  currency: TRY
  max_wall_clock_hours: 72.0
  max_total_cost_try: 8000.0
  live_cost_must_be_measured_before_launch: true
  max_live_hourly_cost_try: 111.1111111111
  usd_try_reference_policy: live_provider_or_market_rate_at_launch_time
  max_allowed_usd_per_hour_formula: max_total_cost_try / usd_try_rate / max_wall_clock_hours
  terminate_if_projected_over_budget: true
  terminate_if_projected_over_time: true
  terminate_if_spot_preempted_without_checkpoint: true
pilot:
  optimizer_steps: 1000
  warmup_discard_steps: 100
  validation_every_steps: 250
  batch_size_per_gpu: 8
  gradient_accumulation: 32
  effective_batch_target: 256
  mixed_precision: bf16_or_fp16_if_stable
  seed: 2026092911
  checkpoint_every_steps: 250
  output_dir: artifacts/gates/V1.1/P4_1L4_10P_fallback_benchmark
measured_go_rules:
  min_effective_rank: 75.0
  min_independent_representations: 75
  require_finite_metrics: true
  require_no_collapse: true
  require_all_15_families_routeable: true
  require_registry_coverage_complete: true
  require_gpu_count: 1
  required_gpu_utilization_mean_min: 0.70
  required_successful_steps: 1000
  projection_steps:
    p10: 1200000
  projection_must_fit:
    steps: 1200000
    max_hours: 72.0
    max_total_cost_try: 8000.0
    no_go_rule: decline_if_1_2m_projects_over_72h_or_8000_try
  min_steps_per_second_for_72h:
    p10_1_2m: 4.6296296296
fail_closed_on:
  - less_than_1_l4_allocated
  - rank_below_75
  - non_finite_loss_or_metric
  - representation_collapse
  - oom_or_cuda_error
  - dataloader_stall
  - checkpoint_write_failure
  - projected_runtime_over_72h
  - projected_cost_over_8000_try
  - provider_price_above_launch_cap
  - p4_v1_line_contamination
notes:
  - This is a fallback benchmark only because 8-L4 quota is unavailable.
  - It does not train or promote V1.1.
  - A 1.2M-step V1.1 10P run may start only if this measured 1-L4 benchmark passes every gate and projects under 72h and 8000 TRY.
  - Preserve exact evidence, sample/lab paths, registry coverage, and the frozen/current P4 V1 line exactly as in the 8-L4 gate.
