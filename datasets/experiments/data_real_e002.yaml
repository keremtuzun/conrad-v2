# DATA-REAL-E002: ECMER on real SubPipe data (SubPipeMini2.zip, CC BY 4.0, Alvarez-Tunon et al. 2024).
# Hypothesis, split and pass threshold were fixed in this file (2026-09-19) BEFORE the first run.
experiment: {id: DATA-REAL-E002}
hypothesis: >-
  (a1) On real SubPipe cam0 frames the engineered ECMER quality features respond in the physically
  expected direction to controlled blur / noise / darkening, and the ECMER encoder yields finite
  contract-valid Evidence. (a2) A logistic probe on ECMER evidence (256-d event embedding, randomly
  initialised encoder) predicts the dataset's side-scan-sonar "Pipeline" presence label on held-out
  time blocks better than the trivial majority baseline.
manifest_id: public.subpipe
seeds: [2026201, 2026202, 2026203]

# ---- (a2) sonar pipeline presence, low-frequency side-scan (all 1055 images are listed in COCO)
sonar_stream: sss_lf
split:
  unit: time_block            # the archive holds ONE mission: no independent sequence/site exists
  n_blocks: 10                # contiguous, equal-count blocks after sorting by timestamp
  test_blocks: [2, 7]
  validation_blocks: [4]
  boundary_guard_images: 3    # dropped on each side of a boundary between different splits
probe:
  l2_grid: [0.001, 0.01, 0.1, 1.0]   # chosen on validation blocks only
  steps: 400
  lr: 0.1
baselines: [majority_class, engineered_quality_only_probe]
primary_metric: test_balanced_accuracy_ecmer_probe
direction: higher
pass:
  min_balanced_accuracy: 0.60      # ENGINEERING_ESTIMATE, fixed before running
  min_margin_over_majority: 0.10
  require_bootstrap_ci_low_above: 0.5   # 95% percentile bootstrap over test images, every seed
  bootstrap_resamples: 1000

# ---- (a1) camera quality sanity, cam0 GoPro
camera_stream: cam0
camera_stride: 30            # 30 Hz -> 1 frame per second
camera_max_frames: 120
corruptions: {blur_sigma_px: 3.0, noise_sigma_u8: 20.0, darken_factor: 0.4}
camera_pass_fraction: 0.9    # ENGINEERING_ESTIMATE

# ---- (b) Model2S integration: NOT RUN (see limitations)
limitations:
  - "single mission: held-out time blocks of one survey, not an independent sequence or site"
  - "labels are human 'Pipeline' boxes on colormapped side-scan images; presence only, no structural condition"
  - "ECMER weights are random (untrained); a probe on random features tests information retention, not a trained ECMER"
  - "sonar images are colormapped PPM renderings (TVG/normalisation applied by the dataset), not raw backscatter"
  - "this archive (SubPipeMiniSSS) contains no RGB segmentation masks; camera frames are unlabelled"
  - "(b) Model2S not run: EstimatedState is the vehicle's own navigation estimate with undocumented frame conventions (not ground truth), and the side-scan/DVL mount geometry needed for range integration is not published"
