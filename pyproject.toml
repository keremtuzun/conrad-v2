[project]
name = "conrad-v2"
version = "0.2.0"
description = "Conrad V2: persistent-belief autonomous underwater inspection stack (truth / belief / decision planes)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.4,<2.7",
  "opencv-python>=4.9,<5",
  "pyyaml>=6,<7",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "mlflow>=2,<4",
  "typer>=0.12,<1",
  "structlog>=24,<26",
  "pyzmq>=26,<28",
]

[project.scripts]
conrad = "conrad.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conrad"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["artifacts", "unity", "docs/specification/source"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["UP042", "E501", "RUF012", "B008", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["artifacts/", "unity/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running test",
  "gpu: requires CUDA device",
  "legacy_independence: verifies operation without the Digital Twin legacy repository",
]
filterwarnings = ["ignore::DeprecationWarning"]
